[project]
name = "smartbudget-server"
version = "0.1.0"
description = "A FastAPI-based SmartBudget API server"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.14.0",
    "sqlalchemy==2.0.53",
    "starlette==1.6.0",
    "tzdata==2025.2; sys_platform == 'win32'",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "D101", "D102", "D103", "D105", "D106", "D107", "D300",
    "E4", "E7", "E9", "F", "I", "N",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
